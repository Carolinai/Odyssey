<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odyssey - 客户详情</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand"><a href="/" style="color:#fff;text-decoration:none;margin-left:0">Odyssey</a></span>
    <nav><a href="/">返回主页</a><a href="/decrypt.html">RSA 工具</a></nav>
</header>

<main class="container detail-page">
    <h1 id="page-title">客户详情</h1>
    <div id="page-subtitle" class="page-subtitle"></div>

    <div class="form-section">
        <h2>基本信息</h2>
        <div id="basic-section"></div>
        <div id="tags-section"></div>
    </div>

    <div class="form-section">
        <h2>文件（VPN 软件、使用文档等）</h2>
        <div id="files-section"></div>
    </div>

    <div class="form-section">
        <h2>环境</h2>
        <div class="tabs" id="env-tabs"></div>
        <div class="env-layout">
            <div class="env-side" id="env-side"></div>
            <div id="env-content" class="env-main"></div>
        </div>
    </div>

    <div class="action-bar">
        <button id="delete-btn" class="btn btn-danger hidden">删除此客户</button>
        <button id="save-btn" class="btn btn-primary">保存</button>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/env.js"></script>
</body>
</html>
