<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odyssey - 客户详情</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="envs">
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>

<main class="container detail-page">
    <a class="back-link" href="/">← 返回列表</a>
    <h1 id="page-title">客户详情</h1>
    <div id="page-subtitle" class="page-subtitle"></div>

    <div class="detail-layout">
        <nav class="detail-nav" id="detail-nav">
            <a href="#sec-basic" class="active">基本信息</a>
            <a href="#sec-files">文件</a>
            <a href="#sec-env">环境</a>
        </nav>

        <div class="detail-body">
            <div class="form-section" id="sec-basic">
                <h2>基本信息</h2>
                <div id="basic-section"></div>
                <div id="tags-section"></div>
            </div>

            <div class="form-section" id="sec-files">
                <h2>文件（VPN 软件、使用文档等）</h2>
                <div id="files-section"></div>
            </div>

            <div class="form-section" id="sec-env">
                <h2>环境</h2>
                <div class="tabs" id="env-tabs"></div>
                <div class="env-layout">
                    <div class="env-side" id="env-side"></div>
                    <div id="env-content" class="env-main"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button id="delete-btn" class="btn btn-danger hidden">删除此客户</button>
        <button id="save-btn" class="btn btn-primary">保存</button>
    </div>
</main>
</div>

<script src="/js/common.js"></script>
<script src="/js/env.js"></script>
</body>
</html>
