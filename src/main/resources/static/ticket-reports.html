<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odyssey - AI 工单分析报告</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="ticket-reports">
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>

<main class="container">
    <h1>AI 工单分析报告</h1>
    <p class="page-hint">
        按筛选范围用 AI 生成工单分析报告（工单情况总结、维度分析、优化建议、相似工单簇），耗时约 1~3 分钟，生成期间可离开页面稍后回来查看。<br>
        AI 调用使用<strong>你个人的</strong> AI 配置：首次使用请先到<a href="/personal.html">个人中心 → 工单助手配置</a>填写 AI Base URL、API Key 与模型名。
    </p>

    <div id="report-alert" class="sync-alert" style="display:none;"></div>

    <div class="form-section">
        <h2>生成新报告</h2>
        <div class="dash-filter-grid">
            <div class="dash-field span-2">
                <span class="dash-field-label">时间范围</span>
                <input type="date" id="f-from">
                <span class="dash-sep">~</span>
                <input type="date" id="f-to">
                <span class="dash-field-hint">留空默认近六个月</span>
            </div>
            <div class="dash-field">
                <span class="dash-field-label">产品线</span>
                <select id="f-product"><option value="">全部</option></select>
            </div>
            <div class="dash-field">
                <span class="dash-field-label">客户</span>
                <select id="f-customer"><option value="">全部</option></select>
            </div>
            <div class="dash-field">
                <span class="dash-field-label">状态</span>
                <select id="f-status"><option value="">全部</option></select>
            </div>
        </div>
        <div class="section-actions">
            <button id="report-generate" class="btn btn-primary" type="button">生成报告</button>
        </div>
        <div id="report-progress" style="display:none;">
            <div class="sync-status-row"><span class="running" id="report-stage">准备中…</span><span class="progress" id="report-percent"></span></div>
            <div class="sync-progress-bar"><div class="sync-progress-fill" id="report-bar" style="width:0%;"></div></div>
        </div>
    </div>

    <div class="form-section">
        <h2>历史报告</h2>
        <div id="report-list">尚未加载</div>
    </div>
</main>
</div>

<!-- 报告查看弹层 -->
<div class="dash-modal-mask" id="view-mask" style="display:none;">
    <div class="dash-modal report-modal">
        <div class="dash-modal-head">
            <span id="view-title">报告</span>
            <button type="button" class="dash-modal-close" id="view-close">×</button>
        </div>
        <div class="dash-modal-body report-body" id="view-body">加载中…</div>
        <div class="dash-modal-foot">
            <button type="button" class="btn btn-primary" id="view-export">导出 Markdown</button>
            <span class="dash-page-hint">导出为 .md 文件（可直接粘贴进文档工具）</span>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/ticket-reports.js"></script>
</body>
</html>
